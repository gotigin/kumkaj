    li { margin: 0.25rem 0; }
    a { color: var(--link); }
    em { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
    code {
      font-family: ui-monospace, "Liberation Mono", monospace;
      font-size: 0.92em;
      background: var(--code-bg);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }

    .legal-nav a { color: var(--link); }
