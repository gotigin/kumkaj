<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title$</title>
  <meta name="description" content="How Khaynjo treats your data — local-first shop books on your devices." />
  <link rel="canonical" href="https://khaynjo.com/privacy" />
  <style>
    :root {
      color-scheme: light;
      --ink: #260b08;
      --muted: #6b4a3f;
      --link: #9a0e10;
      --rule: #e8d8d0;
      --code-bg: #f7f0ec;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      line-height: 1.55;
      color: var(--ink);
      background: #fffaf7;
    }
    .site-back { margin: 0 0 1.25rem; }
    .site-back a { color: var(--link); text-decoration: none; font-weight: 600; }
    .site-back a:hover { text-decoration: underline; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.75rem; }
    h2 { font-size: 1.2rem; margin: 1.75rem 0 0.5rem; }
    h3 { font-size: 1.05rem; margin: 1.25rem 0 0.4rem; }
    p, ul, ol { margin: 0.55rem 0; }
    ul, ol { padding-left: 1.35rem; }
    li { margin: 0.25rem 0; }
    a { color: var(--link); }
    em { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
    code {
      font-family: ui-monospace, "Liberation Mono", monospace;
      font-size: 0.92em;
      background: var(--code-bg);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
  </style>
</head>
<body>
  <p class="site-back"><a href="/">← Khaynjo</a></p>
$body$
</body>
</html>
