<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title$</title>
  <meta name="description" content="How Moklanjo treats your data — local-first books on your devices." />
  <link rel="canonical" href="https://moklanjo.com/privacy" />
  <meta name="theme-color" content="#D6E0EC" />
  <meta property="og:site_name" content="Moklanjo" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="$title$" />
  <meta property="og:description" content="How Moklanjo treats your data — local-first books on your devices." />
  <meta property="og:url" content="https://moklanjo.com/privacy" />
  <meta property="og:image" content="https://moklanjo.com/media/link-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The moklanjo.com home page: Book, move and settle every parcel — one courier OS on your own devices." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://moklanjo.com/media/link-preview.jpg" />
  <meta name="twitter:title" content="$title$" />
  <meta name="twitter:description" content="How Moklanjo treats your data — local-first books on your devices." />
  <meta name="twitter:image:alt" content="The moklanjo.com home page: Book, move and settle every parcel — one courier OS on your own devices." />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
  <style>
    :root {
      color-scheme: light;
      --ink: #0B1220;
      --muted: #3A4554;
      --link: #072058;
      --rule: #C3D0E2;
      --code-bg: #EEF3F8;
      --bg: #D6E0EC;
    }
    body {
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
    }
    .site-back { margin: 0 0 1.25rem; }
    .site-back a { color: var(--link); text-decoration: none; font-weight: 600; }
    .site-back a:hover { text-decoration: underline; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 0.75rem; }
    h2 { font-size: 1.2rem; margin: 1.75rem 0 0.5rem; }
    h3 { font-size: 1.05rem; margin: 1.25rem 0 0.4rem; }
    p, ul, ol { margin: 0.55rem 0; }
    ul, ol { padding-left: 1.35rem; }
    li { margin: 0.25rem 0; }
    a { color: var(--link); }
    em { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
    code {
      font-family: ui-monospace, "Liberation Mono", monospace;
      font-size: 0.92em;
      background: var(--code-bg);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: var(--code-bg);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
  </style>
</head>
<body>
  <p class="site-back"><a href="/">← Moklanjo</a></p>
$body$
</body>
</html>
