[package]
name = "kumkaj"
version = "0.1.0"
edition = "2024"
description = "Gotigin Kumkaj — local-first business operating system"
license = "MIT OR Apache-2.0"

[package.metadata.packager]
identifier = "com.kumkaj.app"
product_name = "Kumkaj"

[package.metadata.makepad.android]
version_code = 1
version_name = "0.1.0"
min_sdk_version = 26

[dependencies]
makepad-widgets = { path = "../../vendor/makepad/widgets" }
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = { version = "2", features = ["json"] }

# Desktop-only: neither crate builds for Android. There the clipboard goes
# through `Cx::copy_to_clipboard` and files through Makepad's own picker.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
rfd = "0.15"
arboard = "3"
