[alias]
# Live Cursor workflow: loads apps/moklanjo/env/development.env, then --hot --remote (F12).
# Usage: cargo moklanjo-dev
moklanjo-dev = ["run", "-p", "moklanjo-dev", "--"]
# Khaynjo desktop live-dev (apps/khaynjo, com.khaynjo.debug).
# Usage: cargo khaynjo-dev
khaynjo-dev = ["run", "-p", "khaynjo-dev", "--"]
# Khaynjo Android: build + install + launch (apps/khaynjo/env/development.env → com.khaynjo.debug).
# Usage: cargo khaynjo-android-dev
khaynjo-android-dev = ["run", "-p", "khaynjo-android-dev", "--"]
# Khaynjo Windows Dev package (cross from Linux with mingw; Win10 + Win11 x86_64).
# Makepad layout: exe + kumkaj_khaynjo/resources beside it (underscores).
# Usage: cargo khaynjo-windows-dev → dist/khaynjo-windows-dev/
khaynjo-windows-dev = ["run", "-p", "khaynjo-windows-dev", "--"]
# Android: build + install + launch (apps/moklanjo/env/development.env → com.moklanjo.debug).
# Usage: cargo moklanjo-android-dev
# (No Splash --hot on Android — each run rebuilds and relaunches.)
moklanjo-android-dev = ["run", "-p", "moklanjo-android-dev", "--"]
# Windows Dev package (cross from Linux with mingw; Win10 + Win11 x86_64).
# Makepad layout: exe + kumkaj_moklanjo/resources beside it (underscores).
# Usage: cargo moklanjo-windows-dev → dist/moklanjo-windows-dev/
# Production: ./apps/moklanjo/scripts/package-windows.sh → dist/moklanjo-windows/
moklanjo-windows-dev = ["run", "-p", "moklanjo-windows-dev", "--"]

# Cross-link Windows GNU target from Arch (pacman -S mingw-w64-gcc).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Window / taskbar icons for Makepad (regen: ./apps/moklanjo/scripts/generate-icons.sh).
# Workspace default = Moklanjo's; Khaynjo's scripts export its own MAKEPAD_APP_ICON_*.
[env]
MAKEPAD_APP_ICON_32 = { value = "apps/moklanjo/resources/icon_32.png", relative = true }
MAKEPAD_APP_ICON_64 = { value = "apps/moklanjo/resources/icon_64.png", relative = true }
MAKEPAD_APP_ICON_128 = { value = "apps/moklanjo/resources/icon_128.png", relative = true }
MAKEPAD_APP_ICON_256 = { value = "apps/moklanjo/resources/icon_256.png", relative = true }
MAKEPAD_APP_ICON_512 = { value = "apps/moklanjo/resources/icon_512.png", relative = true }
MAKEPAD_APP_ICON_1024 = { value = "apps/moklanjo/resources/icon_1024.png", relative = true }
MAKEPAD_APP_ICON_ICO = { value = "apps/moklanjo/resources/icon.ico", relative = true }
