[alias]
# Live Cursor workflow: loads env/development.env, then --hot --remote (F12).
# Usage: cargo kumkaj-dev
kumkaj-dev = ["run", "-p", "kumkaj-dev", "--"]
# Android: build + install + launch (env/development.env → com.kumkaj.app.debug).
# Usage: cargo kumkaj-android-dev
# (No Splash --hot on Android — each run rebuilds and relaunches.)
kumkaj-android-dev = ["run", "-p", "kumkaj-android-dev", "--"]
# Windows Dev package (cross from Linux with mingw; Win10 + Win11 x86_64).
# Makepad layout: exe + kumkaj/resources beside it.
# Usage: cargo kumkaj-windows-dev → dist/windows-dev/
# Production: ./scripts/package-windows.sh → dist/windows/
kumkaj-windows-dev = ["run", "-p", "kumkaj-windows-dev", "--"]

# Cross-link Windows GNU target from Arch (pacman -S mingw-w64-gcc).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Window / taskbar icons for Makepad (regen: ./scripts/generate-app-icons.sh).
[env]
MAKEPAD_APP_ICON_32 = { value = "apps/kumkaj/resources/icon_32.png", relative = true }
MAKEPAD_APP_ICON_64 = { value = "apps/kumkaj/resources/icon_64.png", relative = true }
MAKEPAD_APP_ICON_128 = { value = "apps/kumkaj/resources/icon_128.png", relative = true }
MAKEPAD_APP_ICON_256 = { value = "apps/kumkaj/resources/icon_256.png", relative = true }
MAKEPAD_APP_ICON_512 = { value = "apps/kumkaj/resources/icon_512.png", relative = true }
MAKEPAD_APP_ICON_1024 = { value = "apps/kumkaj/resources/icon_1024.png", relative = true }
MAKEPAD_APP_ICON_ICO = { value = "apps/kumkaj/resources/icon.ico", relative = true }
