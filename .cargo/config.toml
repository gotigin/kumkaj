[alias]
# Live Cursor workflow: Splash/script_mod hot-reload + remote tweaker (F12).
# Usage: cargo kumkaj-dev
kumkaj-dev = ["run", "-p", "kumkaj", "--", "--hot", "--remote"]
# Android: build + install + launch on connected device/emulator.
# Usage: cargo kumkaj-android-dev
# (No Splash --hot on Android — each run rebuilds and relaunches.)
kumkaj-android-dev = ["run", "-p", "kumkaj-android-dev", "--"]
