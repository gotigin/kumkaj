# Kumkaj common workspace — the ONLY shared thing between apps.
# Every app is built on the same vendored Makepad 2 (vendor/makepad)
# with similar libraries because BOS apps have similar requirements.
# There is NO Kumkaj core / shared product crate, and none may be added:
# each app under apps/<app>/ owns all of its product/business code
# (copy-then-diverge; duplication is preferable to coupling), so a
# change in one app never impacts another. See
# docs/KUMKAJ_PRODUCT_VISION_AND_REQUIREMENTS.md §1–2 and docs/DEV.md.
[workspace]
members = [
    "apps/moklanjo",
    "apps/khaynjo",
    "tools/khaynjo-dev",
    "tools/khaynjo-android-dev",
    "tools/khaynjo-windows-dev",
    "tools/moklanjo-dev",
    "tools/moklanjo-android-dev",
    "tools/moklanjo-windows-dev",
]
exclude = [
    "vendor/makepad",
]
resolver = "2"

# Image codecs are optimised even in dev builds. Unoptimised, one ~470×1024
# dish photo took ~250 ms to decode, so photo thumbs crawled in during
# `cargo khaynjo-dev` / `cargo moklanjo-dev`. Build speed only — no product
# behaviour changes, and app code stays debuggable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.makepad-webp]
opt-level = 3
[profile.dev.package.makepad-zune-jpeg]
opt-level = 3
[profile.dev.package.makepad-zune-png]
opt-level = 3
[profile.dev.package.makepad-zune-inflate]
opt-level = 3

# Android live-dev: release-speed native code, but NOT the cargo profile name
# `release` — cargo-makepad sets android:debuggable=true iff profile != "release".
# Plain `dev` on phone is too slow (first frame after surface already torn down → black screen).
# Full `debug = true` embeds ~400MB DWARF into libmakepad.so; load alone on API 26
# Mali leaves a black SurfaceView for many seconds (looks "broken"). Line tables
# keep useful panic locations without that bloat. APK stays debuggable via profile name.
[profile.android-dev]
inherits = "release"
debug = "line-tables-only"
# keep lto off for faster incremental device rebuilds than full release
lto = false
codegen-units = 16
